name = remoteAudioClient
summary = "NVDA Remote Audio Client"
description = """Secure low-latency remote audio alongside NVDA Remote. Supports application isolation, AES-GCM encryption, Opus or PCM quality modes, playback-device selection, EQ, pan, WAV recording, connection profiles, and peer-to-peer RemSound connections to its Windows, iPhone and Android apps."""
author = "serrebidev"
url = https://github.com/serrebidev/NVDARemoteAudioClient
version = 0.2.6
changelog = """Choosing a RemSound device now says, in the same message, that RemSound also needs an encryption password, because it is the one path that changes the connection type without the settings panel's password check. Without it a RemSound setup could be created that could never start."""
docFileName = readme.html
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
