name = remoteAudioClient
summary = "NVDA Remote Audio Client"
description = """Secure low-latency remote audio alongside NVDA Remote. Supports application isolation, AES-GCM encryption, Opus or PCM quality modes, playback-device selection, EQ, pan, WAV recording, connection profiles, and peer-to-peer RemSound connections to its Windows, iPhone and Android apps."""
author = "serrebidev"
url = https://github.com/serrebidev/NVDARemoteAudioClient
version = 0.2.11
changelog = """Group calls through a RemSound V2 relay: type the relay address into the new "RemSound relay for group calls" setting, connect, and tick who to hear in NVDA menu > Tools > NVDA Remote Audio > Choose RemSound relay members. Ticking works both ways, like the phone app. Audio, formats, heartbeats and volume commands use group framing while the relay's member list is fresh, and fall back to ordinary device-to-device behavior if the lists stop."""
docFileName = readme.html
minimumNVDAVersion = 2025.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
